<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIKO – האזור האישי</title>
<link rel="icon" href="assets/Logo.png">
<link rel="preload" href="assets/fonts/fredoka-he-latin.woff" as="font" type="font/woff" crossorigin>
<style>
:root{--bg:#f7ead8;--paper:#fffdf9;--orange:#ed5b2d;--orange2:#fff0e9;--ink:#342d2a;--muted:#756b65;--line:#ead9ca;--green:#6f8a70;--blue:#3b6fa8;--blue2:#eaf1f8;--shadow:0 16px 42px rgba(75,53,37,.10)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Segoe UI",sans-serif}
body{min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:880px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:.4px}
.brand img{width:40px;height:40px;object-fit:contain;border-radius:10px}
.brand span{color:var(--orange)}.brand .sub{color:var(--ink)}
.top .space{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;background:var(--orange2);color:#b6401b}
.chip.ot{background:var(--blue2);color:#2f5f8f}
.link{background:none;border:0;color:var(--orange);font-weight:800;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.card+.card{margin-top:14px}
h1{font-size:28px;margin:0 0 8px;line-height:1.25}
h2{font-size:20px;margin:0 0 6px}
h3{font-size:16px;margin:0 0 6px}
.lead{color:var(--muted);line-height:1.6;margin:0 0 18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 20px;font-weight:900;cursor:pointer;background:var(--orange);color:#fff;font-size:16px;transition:transform .12s,box-shadow .12s;box-shadow:0 6px 16px rgba(237,91,45,.25)}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-weight:800;margin-bottom:6px;font-size:14.5px}
.field small{display:block;color:var(--muted);margin-top:5px;font-size:12.5px;line-height:1.45}
.input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:#fff;font-size:16px;outline:none}
.input:focus{border-color:#ed9f80;box-shadow:0 0 0 3px rgba(237,91,45,.12)}
.input.code{letter-spacing:2px;font-weight:900;text-transform:uppercase;direction:ltr;text-align:center}
.input.pin{letter-spacing:10px;font-weight:900;direction:ltr;text-align:center;font-size:22px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:4px 0 16px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--orange)}
.error{color:#b42318;font-weight:800;min-height:20px;margin:6px 0;font-size:14px}
.ok{color:var(--green);font-weight:800}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.choice{border:1.5px solid var(--line);border-radius:18px;background:#fff;padding:16px;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:4px}
.choice b{font-size:16px}
.choice small{color:var(--muted);line-height:1.45}
.choice .ico{font-size:26px}
.choice[aria-pressed="true"]{border-color:var(--orange);background:var(--orange2);box-shadow:0 0 0 3px rgba(237,91,45,.10)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .choice{flex-direction:row;padding:9px 15px;border-radius:999px;font-weight:800}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:22px;align-items:center}
.hero img{width:100%;max-width:300px;justify-self:center}
.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 18px}
.path{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;font-size:13px;line-height:1.45;color:var(--muted)}
.path b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.guest{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted)}
.codebox{background:var(--orange2);border:2px dashed #efad91;border-radius:20px;padding:18px;text-align:center;margin:14px 0}
.codebox .big{font-size:34px;font-weight:900;letter-spacing:3px;direction:ltr;color:#b6401b}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:14px}
.kid{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:6px;transition:.15s}
.kid:hover{border-color:#ed9f80;transform:translateY(-2px)}
.kid .name{font-size:19px;font-weight:900}
.kid .meta{color:var(--muted);font-size:13px}
.add{border-style:dashed;align-items:center;justify-content:center;color:var(--orange);font-weight:900;min-height:120px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 4px}
.action{border:1px solid var(--line);background:#fff;border-radius:20px;padding:18px;cursor:pointer;text-align:right;display:flex;flex-direction:column;gap:6px;transition:.15s}
.action:hover{border-color:#ed9f80;transform:translateY(-2px)}
.action.primary{background:var(--orange);border-color:var(--orange);color:#fff;box-shadow:0 10px 24px rgba(237,91,45,.25)}
.action.primary small{color:#ffe6dc}
.action .ico{font-size:26px}
.action b{font-size:17px}
.action small{color:var(--muted);line-height:1.45}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.part{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;text-align:center;font-size:13px;font-weight:800}
.part img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#f4eee8;display:block;margin-bottom:6px}
.share{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--blue2);border-radius:16px;padding:12px 14px;font-size:13.5px;color:#2f5f8f}
.share code{font-weight:900;font-size:16px;letter-spacing:1.5px;direction:ltr;background:#fff;border-radius:10px;padding:4px 10px}
.mini{border:0;background:#fff;border-radius:10px;padding:6px 10px;font-weight:800;cursor:pointer;color:#2f5f8f;font-size:12.5px}
.timeline{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.entry{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;border-inline-start:5px solid var(--orange)}
.entry.feedback{border-inline-start-color:var(--blue)}
.entry header{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.entry header b{font-size:15.5px}
.entry header .date{color:var(--muted);font-size:13px;margin-inline-start:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:13.5px;line-height:1.5}
.kv dt{color:var(--muted);font-weight:800}
.kv dd{margin:0}
details summary{cursor:pointer;color:var(--orange);font-weight:800;font-size:13px;margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:18px;background:#fffaf5}
.back{display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.notice{background:#fff7e6;border:1px solid #f3d9a4;border-radius:16px;padding:14px;color:#7a5410;line-height:1.55;font-size:14px}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--orange);animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
@font-face{font-family:Fredoka;src:url(assets/fonts/fredoka-he-latin.woff) format('woff');font-weight:500 700;font-display:swap}
/* ---------- splash ---------- */
#splash{display:none}
body.splash-on{padding:0}
body.splash-on .wrap{display:none}
body.splash-on #splash{display:block;position:relative;overflow-x:hidden;min-height:100vh;min-height:100dvh;font-family:Fredoka,Arial,sans-serif;background:radial-gradient(ellipse 70% 60% at 30% 50%,#fdf6ea 0%,#f7ead8 70%)}
.sp-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.sp-lines g{transform-origin:var(--cx) var(--cy);animation:sp-lines 1s cubic-bezier(.16,1,.3,1) .05s both}
@keyframes sp-lines{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
.sp{position:relative;z-index:1;min-height:100vh;min-height:100dvh;max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;gap:24px;padding:24px 32px}
.sp-text{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.sp-logo{width:46px;height:46px;border-radius:12px;animation:sp-in .5s ease .55s both}
.sp-word{margin:0;font-weight:700;font-size:clamp(86px,11vw,170px);line-height:.92;letter-spacing:.02em;color:#ed5b2d;text-shadow:0 .045em 0 #c8401c,0 .1em .18em rgba(120,50,20,.18);animation:sp-in .6s cubic-bezier(.2,1.3,.4,1) .6s both}
.sp-tag{margin:0 0 18px;font-weight:500;font-size:clamp(19px,1.8vw,24px);color:var(--ink);animation:sp-in .5s ease .75s both}
.sp-actions{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;animation:sp-in .5s ease .85s both}
.sp-btn{font-family:inherit;font-size:19px;font-weight:600;border-radius:18px;padding:15px 22px;cursor:pointer;transition:transform .1s,box-shadow .1s}
.sp-btn.main{border:0;background:#ed5b2d;color:#fff;box-shadow:0 5px 0 #c4441c,0 12px 26px rgba(237,91,45,.28)}
.sp-btn.main:active{transform:translateY(3px);box-shadow:0 2px 0 #c4441c,0 6px 16px rgba(237,91,45,.25)}
.sp-btn.ghost{border:1.5px solid var(--line);background:#fffdf9;color:var(--ink)}
.sp-btn.ghost:hover{border-color:#ed9f80}
.sp-btn:focus-visible,.sp-guest a:focus-visible{outline:3px solid #ed5b2d;outline-offset:3px}
.sp-guest{font-size:14.5px;color:var(--muted);margin-top:6px;font-family:Arial,"Segoe UI",sans-serif}
.sp-guest a{color:#c8401c;font-weight:700;text-underline-offset:3px;margin-inline-start:8px}
.sp-hero{display:flex;justify-content:center;align-items:center}
.sp-hero img{display:block;width:100%;max-width:680px;max-height:94vh;object-fit:contain;animation:sp-burst .9s cubic-bezier(.16,1.18,.36,1) .05s both}
@keyframes sp-burst{0%{opacity:0;transform:scale(.72) translateY(4%) rotate(-3deg)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes sp-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (max-width:760px){
  .sp{grid-template-columns:1fr;gap:4px;padding:10px 18px max(22px,env(safe-area-inset-bottom));align-content:start}
  .sp-hero{order:-1}
  .sp-hero img{max-width:430px;max-height:50vh;max-height:50dvh}
  .sp-text{align-items:center;text-align:center;gap:6px}
  .sp-logo{display:none}
  .sp-word{font-size:clamp(66px,19vw,96px)}
  .sp-tag{margin-bottom:12px}
  .sp-actions{width:100%}
}
@media (prefers-reduced-motion:reduce){.sp-lines g,.sp-hero img,.sp-word,.sp-tag,.sp-actions,.sp-logo{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="assets/Logo.png" alt=""><div><span>KIKO</span><span class="sub"> · האזור האישי</span></div></div>
    <div class="space"></div>
    <div class="who" id="who" hidden><span class="name" id="whoName"></span><span class="chip" id="whoRole"></span><button class="link" id="logoutBtn">יציאה</button></div>
  </div>

  <main id="app"><div class="spinner"></div></main>
</div>
<div id="splash"></div>

<script src="assets/kiko-hub.js"></script>
<script>
(function(){
const H = window.KikoHub;
const app = document.getElementById('app');
const ROLE_LABEL = {parent:'הורה', ot:'מרפא/ה בעיסוק'};
const AGES = ['2–3','4–5','6–7','8–9','10+'];
let state = {user:null, children:[], catalog:null, labels:null};

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, one, many) => n === 1 ? one : n + ' ' + many;
const ageTxt = a => a ? 'גיל <bdi dir="ltr">' + esc(a) + '</bdi>' : '';
const fmtDate = iso => { if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'}); };
const fmtDateTime = iso => { if(!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('he-IL',{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}); };
function view(html){ document.body.classList.remove('splash-on'); app.innerHTML = html; window.scrollTo({top:0}); }
function $(sel){ return app.querySelector(sel); }
function busy(btn, on, text){ if(!btn) return; if(on){ btn.dataset.t = btn.textContent; btn.textContent = text||'רגע...'; btn.disabled = true; } else { btn.textContent = btn.dataset.t||btn.textContent; btn.disabled = false; } }
function bindChoice(container, onPick){
  container.querySelectorAll('.choice').forEach(b => b.addEventListener('click', () => {
    container.querySelectorAll('.choice').forEach(x => x.setAttribute('aria-pressed', String(x===b)));
    onPick(b.dataset.value);
  }));
}
function setWho(){
  const w = document.getElementById('who');
  document.body.classList.toggle('authed', !!state.user);
  if(!state.user){ w.hidden = true; return; }
  w.hidden = false;
  document.getElementById('whoName').textContent = state.user.name;
  const r = document.getElementById('whoRole');
  r.textContent = ROLE_LABEL[state.user.role] || '';
  r.className = 'chip' + (state.user.role==='ot' ? ' ot' : '');
}
document.getElementById('logoutBtn').onclick = () => { H.logout(); state.user = null; setWho(); showWelcome(); };

async function loadCatalog(){
  if(state.catalog) return state.catalog;
  try{
    const c = await (await fetch('catalog/catalog.json', {cache:'no-cache'})).json();
    const v = c.version ? '?v='+encodeURIComponent(c.version) : '';
    const map = {};
    (c.parts||[]).forEach(p => { map[p.id] = Object.assign({}, p, {img: 'catalog/'+p.img+v}); });
    state.catalog = map;
  }catch(e){ state.catalog = {}; }
  return state.catalog;
}
/** Hebrew labels for survey answers, read straight from the two survey pages so they always match. */
async function loadLabels(){
  if(state.labels) return state.labels;
  const labels = {};
  for(const page of ['pre-use.html','post-use.html']){
    try{
      const doc = new DOMParser().parseFromString(await (await fetch(page)).text(), 'text/html');
      doc.querySelectorAll('[data-single],[data-multi]').forEach(g => {
        const key = g.dataset.single || g.dataset.multi;
        g.querySelectorAll('[data-value]').forEach(b => {
          const el = (b.querySelector('b,strong') || b).cloneNode(true);
          el.querySelectorAll('.emo,small').forEach(x => x.remove());
          const t = el.textContent.replace(/\s+/g,' ').trim();
          (labels[key] = labels[key] || {})[b.dataset.value] = t;
        });
      });
    }catch(e){}
  }
  return (state.labels = labels);
}
const lab = (key, v) => (state.labels && state.labels[key] && state.labels[key][v]) || v;
const labList = (key, arr) => (arr||[]).map(v => lab(key, v)).join(' · ');

/* ---------- welcome ---------- */
function showWelcome(){
  setWho();
  const sp = document.getElementById('splash');
  sp.innerHTML = `<div class="sp">
      <div class="sp-text">
        <img class="sp-logo" src="assets/Logo.png" alt="">
        <h1 class="sp-word">KIKO</h1>
        <p class="sp-tag">צעדים קטנים, חוויה חושית גדולה</p>
        <div class="sp-actions">
          <button class="sp-btn main" id="goRegister">פעם ראשונה? הרשמה</button>
          <button class="sp-btn ghost" id="goLogin">יש לי קוד – כניסה</button>
          <div class="sp-guest">בלי הרשמה:<a href="pre-use.html">התאמה חד־פעמית</a><a href="post-use.html">משוב חד־פעמי</a></div>
        </div>
      </div>
      <div class="sp-hero"><img src="assets/hero/kiko-team.webp" srcset="assets/hero/kiko-team-720.webp 720w, assets/hero/kiko-team.webp 1122w" sizes="(max-width:760px) 430px, 640px" alt="צוות KIKO – דמויות בצבעים שונים, כל אחת בנויה מחלקים במרקמים שונים, עפות לעבר המסך"></div>
    </div>`;
  document.body.classList.add('splash-on');
  drawSpeedLines(sp);
  sp.querySelector('#goRegister').onclick = showRegister;
  sp.querySelector('#goLogin').onclick = showLogin;
}

const LINE_COLORS = ['#f19a92','#9cc0f0','#f6cf62','#c3a6ee','#a9cf98','#f7b27a','#f3a6c8'];
function drawSpeedLines(sp){
  const old = sp.querySelector('.sp-lines'); if(old) old.remove();
  const img = sp.querySelector('.sp-hero img'); if(!img) return;
  const place = () => {
    const box = sp.getBoundingClientRect(), r = img.getBoundingClientRect();
    if(!r.width) return;
    const cx = r.left - box.left + r.width/2, cy = r.top - box.top + r.height*.47;
    const W = box.width, H = Math.max(box.height, window.innerHeight), R = Math.hypot(W, H);
    const inner = Math.min(r.width, r.height) * .42;
    let lines = '';
    for(let i = 0; i < 46; i++){
      const a = (i / 46) * Math.PI * 2 + Math.sin(i * 12.9) * .05;
      const r1 = inner * (0.95 + ((i * 37) % 11) / 20), r2 = r1 + R * (0.18 + ((i * 53) % 17) / 40);
      const w = 3 + ((i * 29) % 9);
      lines += `<line x1="${(cx + Math.cos(a)*r1).toFixed(1)}" y1="${(cy + Math.sin(a)*r1).toFixed(1)}" x2="${(cx + Math.cos(a)*r2).toFixed(1)}" y2="${(cy + Math.sin(a)*r2).toFixed(1)}" stroke="${LINE_COLORS[i % LINE_COLORS.length]}" stroke-width="${w}" stroke-linecap="round" opacity="${(.32 + ((i * 7) % 5) * .07).toFixed(2)}"/>`;
    }
    const fade = Math.max(r.width, r.height) * 0.95;
    const svg = `<svg class="sp-lines" style="--cx:${cx}px;--cy:${cy}px" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><radialGradient id="spFade" gradientUnits="userSpaceOnUse" cx="${cx}" cy="${cy}" r="${fade}"><stop offset=".25" stop-color="#fff"/><stop offset=".62" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="spMask"><rect width="${W}" height="${H}" fill="url(#spFade)"/></mask><filter id="spBlur"><feGaussianBlur stdDeviation="1.6"/></filter></defs><g mask="url(#spMask)" filter="url(#spBlur)">${lines}</g></svg>`;
    const prev = sp.querySelector('.sp-lines'); if(prev) prev.remove();
    sp.insertAdjacentHTML('afterbegin', svg);
  };
  if(img.complete) place(); else img.addEventListener('load', place, {once:true});
  clearTimeout(drawSpeedLines.t);
  window.onresize = () => { clearTimeout(drawSpeedLines.t); drawSpeedLines.t = setTimeout(() => { if(document.body.classList.contains('splash-on')) place(); }, 150); };
}

/* ---------- register ---------- */
const normPhone = v => { let d = String(v||'').replace(/\D/g,''); if(d.startsWith('972')) d = '0' + d.slice(3); if(d.length === 9 && d[0] !== '0') d = '0' + d; return /^0\d{8,9}$/.test(d) ? d : ''; };
const pinOnly = el => el.addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g,'').slice(0,4));

function showRegister(){
  const f = {role:''};
  view(`
  <button class="link back" id="back">→ חזרה</button>
  <div class="card">
    <h1>הרשמה</h1>
    <p class="lead">לוקח פחות מדקה. בפעם הבאה נכנסים עם מספר הטלפון והסיסמה.</p>
    <div class="field"><span>מי נרשם?</span>
      <div class="choices" id="role">
        <button class="choice" data-value="parent" aria-pressed="false"><span class="ico">🏠</span><b>הורה / בן משפחה</b><small>מלווים ילד/ה בבית</small></button>
        <button class="choice" data-value="ot" aria-pressed="false"><span class="ico">🧑‍⚕️</span><b>מרפא/ה בעיסוק</b><small>עובדים עם ילד/ה אחד או כמה ילדים</small></button>
      </div>
    </div>
    <label class="field"><span>איך לקרוא לך?</span><input class="input" id="name" maxlength="60" autocomplete="name" placeholder="שם פרטי"></label>
    <label class="field"><span>מספר טלפון</span><input class="input" id="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="050-1234567" style="text-align:right"><small>משמש לכניסה ולשחזור סיסמה. לא נשלח אליו דבר.</small></label>
    <div class="grid2">
      <label class="field"><span>סיסמה – 4 ספרות</span><input class="input pin" id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></label>
      <label class="field"><span>שוב, לאימות</span><input class="input pin" id="pin2" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password"></label>
    </div>
    <label class="check"><input type="checkbox" id="remember" checked> לזכור אותי במכשיר הזה</label>
    <div class="error" id="err"></div>
    <button class="btn block" id="submit">יצירת חשבון</button>
  </div>`);
  $('#back').onclick = showWelcome;
  bindChoice($('#role'), v => f.role = v);
  pinOnly($('#pin')); pinOnly($('#pin2'));
  $('#submit').onclick = async () => {
    const err = $('#err'); err.textContent = '';
    const name = $('#name').value.trim(), phone = normPhone($('#phone').value), pin = $('#pin').value, pin2 = $('#pin2').value;
    if(!f.role) return err.textContent = 'בחרו מי נרשם.';
    if(!name) return err.textContent = 'כתבו איך לקרוא לך.';
    if(!phone) return err.textContent = 'בדקו את מספר הטלפון – למשל 050-1234567.';
    if(!/^\d{4}$/.test(pin)) return err.textContent = 'הסיסמה צריכה להיות 4 ספרות.';
    if(pin !== pin2) return err.textContent = 'שתי הסיסמאות לא זהות.';
    const btn = $('#submit'); busy(btn, true, 'יוצרים חשבון...');
    try{
      const r = await H.api('register', {role:f.role, name, phone, pin}, {noAuth:true});
      H.setAuth({code:r.user.code, pin, role:r.user.role, name:r.user.name}, $('#remember').checked);
      state.user = r.user; state.children = r.children || [];
      if(state.user.role === 'ot') showDashboard(); else showAddChild(true);
    }catch(e){
      if(e.code === 'phone_taken'){ err.innerHTML = 'המספר הזה כבר רשום. <button class="link" id="toLogin">לכניסה</button>'; $('#toLogin').onclick = () => showLogin(phone); }
      else err.textContent = H.errorText(e);
      busy(btn, false);
    }
  };
}

/* ---------- login ---------- */
function showLogin(prefill){
  view(`
  <button class="link back" id="back">→ חזרה</button>
  <div class="card" style="max-width:460px;margin:0 auto">
    <h1>כניסה</h1>
    <p class="lead">מספר הטלפון והסיסמה שבחרתם בהרשמה.</p>
    <label class="field"><span>מספר טלפון</span><input class="input" id="phone" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="050-1234567" style="text-align:right"></label>
    <label class="field"><span>סיסמה</span><input class="input pin" id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password"></label>
    <label class="check"><input type="checkbox" id="remember" checked> לזכור אותי במכשיר הזה</label>
    <div class="error" id="err"></div>
    <button class="btn block" id="submit">כניסה</button>
    <p class="muted small" style="margin-top:14px">שכחתם את הסיסמה? פנו אלינו עם מספר הטלפון ונעזור לשחזר.</p>
  </div>`);
  $('#back').onclick = showWelcome;
  if(typeof prefill === 'string') $('#phone').value = prefill;
  pinOnly($('#pin'));
  const go = async () => {
    const err = $('#err'); err.textContent = '';
    const phone = normPhone($('#phone').value), pin = $('#pin').value;
    if(!phone) return err.textContent = 'בדקו את מספר הטלפון – למשל 050-1234567.';
    if(pin.length !== 4) return err.textContent = 'הסיסמה היא 4 ספרות.';
    const btn = $('#submit'); busy(btn, true, 'נכנסים...');
    try{
      const r = await H.api('login', {phone, pin}, {noAuth:true});
      H.setAuth({code:r.user.code, pin, role:r.user.role, name:r.user.name}, $('#remember').checked);
      state.user = r.user; state.children = r.children || [];
      showDashboard();
    }catch(e){ err.textContent = e.code === 'auth_failed' ? 'מספר הטלפון או הסיסמה לא נכונים.' : H.errorText(e); busy(btn, false); }
  };
  $('#submit').onclick = go;
  $('#pin').addEventListener('keydown', e => { if(e.key==='Enter') go(); });
}

/* ---------- dashboard ---------- */
function showDashboard(){
  setWho();
  const isOT = state.user.role === 'ot';
  const kids = state.children.slice().sort((a,b) => String(b.last_activity||b.created_at).localeCompare(String(a.last_activity||a.created_at)));
  view(`
  <div class="card">
    <h1>שלום ${esc(state.user.name)} 👋</h1>
    <p class="lead">${isOT ? 'הילדים שאתם מלווים. בחרו ילד/ה כדי לראות את היסטוריית המפגשים ולהמשיך את התהליך.' : 'בחרו את הילד/ה כדי לקבל התאמה או לספר איך היה המפגש.'}</p>
    <div class="kids">
      ${kids.map(k => `
        <button class="kid" data-id="${esc(k.child_id)}">
          <span class="name">${esc(k.child_alias)}</span>
          <span class="meta">${ageTxt(k.age_range)}</span>
          <span class="meta">${k.recommendations||k.feedback ? `${plural(k.recommendations,'התאמה אחת','התאמות')} · ${plural(k.feedback,'מפגש אחד','מפגשים')}` : 'עוד לא התחלנו'}</span>
          ${k.last_activity ? `<span class="meta">פעילות אחרונה: ${fmtDate(k.last_activity)}</span>` : ''}
        </button>`).join('')}
      <button class="kid add" id="addKid">＋ הוספת ילד/ה</button>
    </div>
    <div class="guest">${isOT ? 'הורה כבר רשם את הילד/ה? ' : 'המטפל/ת כבר רשמ/ה את הילד/ה? '}<button class="link" id="linkKid">הוספה עם קוד ילד/ה</button></div>
  </div>`);
  app.querySelectorAll('.kid[data-id]').forEach(b => b.onclick = () => showChild(b.dataset.id));
  $('#addKid').onclick = () => showAddChild(false);
  $('#linkKid').onclick = showLinkChild;
}

function showAddChild(first){
  let age = '';
  view(`
  ${first ? '' : '<button class="link back" id="back">→ חזרה</button>'}
  <div class="card" style="max-width:560px;margin:0 auto">
    <h1>${first ? 'נכיר את הילד/ה' : 'הוספת ילד/ה'}</h1>
    <p class="lead">מספיק שם פרטי או כינוי – לא צריך שם מלא.</p>
    <label class="field"><span>שם או כינוי</span><input class="input" id="alias" maxlength="40" placeholder="למשל: נועם"></label>
    <div class="field"><span>גיל</span><div class="chips" id="ages">${AGES.map(a => `<button class="choice" data-value="${a}" aria-pressed="false">${a}</button>`).join('')}</div></div>
    <div class="error" id="err"></div>
    <button class="btn block" id="save">שמירה</button>
  </div>`);
  if(!first) $('#back').onclick = showDashboard;
  bindChoice($('#ages'), v => age = v);
  $('#save').onclick = async () => {
    const err = $('#err'); err.textContent = '';
    const alias = $('#alias').value.trim();
    if(!alias) return err.textContent = 'כתבו שם או כינוי.';
    if(!age) return err.textContent = 'בחרו גיל.';
    const btn = $('#save'); busy(btn, true, 'שומרים...');
    try{
      const r = await H.api('addChild', {child_alias:alias, age_range:age});
      state.children = r.children; showChild(r.child_id);
    }catch(e){ err.textContent = H.errorText(e); busy(btn, false); }
  };
}

function showLinkChild(){
  view(`
  <button class="link back" id="back">→ חזרה</button>
  <div class="card" style="max-width:520px;margin:0 auto">
    <h1>הוספה עם קוד ילד/ה</h1>
    <p class="lead">לכל ילד/ה יש קוד שיתוף (למשל KID-7Q4MX). מי שרשם את הילד/ה יכול לראות אותו בעמוד של הילד/ה ולשלוח לכם.</p>
    <label class="field"><span>קוד הילד/ה</span><input class="input code" id="share" placeholder="KID-XXXXX"></label>
    <div class="error" id="err"></div>
    <button class="btn block" id="save">הוספה</button>
  </div>`);
  $('#back').onclick = showDashboard;
  $('#save').onclick = async () => {
    const err = $('#err'); err.textContent = '';
    let share = $('#share').value.trim().toUpperCase().replace(/\s/g,'');
    if(share && !share.startsWith('KID-')) share = 'KID-' + share.replace(/^KID/,'');
    if(!share) return err.textContent = 'הקלידו את קוד הילד/ה.';
    const btn = $('#save'); busy(btn, true, 'מחפשים...');
    try{ const r = await H.api('linkChild', {share_code:share}); state.children = r.children; showChild(r.child_id); }
    catch(e){ err.textContent = H.errorText(e); busy(btn, false); }
  };
}

/* ---------- child page ---------- */
async function showChild(childId){
  view('<div class="spinner"></div>');
  let ov;
  try{
    [ov] = await Promise.all([H.api('childOverview', {child_id:childId}), loadCatalog(), state.user.role==='ot' ? loadLabels() : null]);
  }catch(e){ view(`<div class="card"><p class="error">${esc(H.errorText(e))}</p><button class="btn secondary" id="back">חזרה</button></div>`); $('#back').onclick = showDashboard; return; }
  const c = ov.child, cur = ov.current, last = ov.last_feedback, isOT = ov.role === 'ot';
  const partCard = id => { const p = state.catalog[id]; return p ? `<div class="part"><img src="${esc(p.img)}" alt="">${esc(p.name)}</div>` : `<div class="part">${esc(id)}</div>`; };
  const hasRec = !!cur;
  view(`
  <button class="link back" id="back">→ ${isOT ? 'כל הילדים' : 'לאזור האישי'}</button>
  <div class="card">
    <h1>${esc(c.child_alias)}</h1>
    <p class="muted" style="margin:0 0 6px">${c.age_range ? ageTxt(c.age_range)+' · ' : ''}${plural(ov.counts.recommendations,'התאמה אחת','התאמות')} · ${plural(ov.counts.feedback,'מפגש אחד','מפגשים')}</p>
    <div class="actions">
      ${hasRec ? `
        <button class="action primary" data-go="post"><span class="ico">💬</span><b>איך היה המפגש?</b><small>ספרו לנו מה עבד ומה פחות – כמה דקות</small></button>
        <button class="action" data-go="pre"><span class="ico">🔁</span><b>התאמה חדשה</b><small>קבלת המלצה נוספת לחלקים</small></button>`
      : `
        <button class="action primary" data-go="pre"><span class="ico">✨</span><b>קבלת המלצה ראשונה</b><small>כמה שאלות קצרות ונמליץ על 3 חלקים</small></button>
        <button class="action" data-go="post"><span class="ico">💬</span><b>כבר שיחקנו – איך היה?</b><small>לספר על מפגש שכבר התקיים</small></button>`}
    </div>
  </div>

  <div class="card">
    <h2>ה־KIKO הנוכחי${cur && cur.kiko_name ? ' · '+esc(cur.kiko_name) : ''}</h2>
    ${cur ? `<p class="muted small" style="margin:0">ההתאמה מ־${fmtDate(cur.date)}${cur.by ? ' · '+esc(cur.by) : ''}</p>
      <div class="parts">${(cur.final_part_ids||[]).map(partCard).join('')}</div>`
      : '<div class="empty">עוד אין התאמה. התחילו ב"קבלת המלצה ראשונה".</div>'}
    ${last ? `<p style="margin:14px 0 0">🕒 מפגש אחרון: <b>${fmtDate(last.date)}</b>${last.best_part ? ` · עבד הכי טוב: <b>${esc((state.catalog[last.best_part_id]||{}).name || last.best_part)}</b>` : ''}</p>` : ''}
  </div>

  ${isOT ? `
  <div class="card">
    <h2>היסטוריית התהליך</h2>
    <p class="muted small" style="margin:0">כל ההתאמות והמפגשים, מהחדש לישן.</p>
    ${(ov.history||[]).length ? `<div class="timeline">${ov.history.map(entryHtml).join('')}</div>` : '<div class="empty" style="margin-top:12px">עוד אין מפגשים מתועדים.</div>'}
  </div>` : ''}

  <div class="card">
    <div class="share"><span>קוד הילד/ה לשיתוף ${isOT ? 'עם ההורים' : 'עם המטפל/ת'}:</span><code>${esc(c.share_code)}</code><button class="mini" id="copyShare">העתקה</button></div>
    <p class="muted small" style="margin:10px 0 0">מי שמקבל את הקוד יכול להוסיף את הילד/ה לאזור האישי שלו ולראות את התהליך.</p>
  </div>`);
  $('#back').onclick = async () => { try{ const r = await H.api('children', {}); state.children = r.children; }catch(e){} showDashboard(); };
  $('#copyShare').onclick = async () => { try{ await navigator.clipboard.writeText(c.share_code); $('#copyShare').textContent = '✓ הועתק'; }catch(e){} };
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    H.setContext({
      child_id: c.child_id, child_alias: c.child_alias, age_range: c.age_range,
      respondent_role: state.user.role === 'ot' ? 'therapist' : 'parent',
      current_part_ids: cur ? cur.final_part_ids : [], order_code: cur ? cur.order_code : ''
    });
    location.href = (b.dataset.go === 'pre' ? 'pre-use.html' : 'post-use.html') + '?child=' + encodeURIComponent(c.child_id);
  });
}

function entryHtml(h){
  const pn = id => (state.catalog[id] && state.catalog[id].name) || id;
  const rows = [];
  if(h.type === 'recommendation'){
    if(h.primary_goal && h.primary_goal.length) rows.push(['מטרות', labList('primary_goal', h.primary_goal)]);
    if(h.preferred_sensations && h.preferred_sensations.length) rows.push(['תחושות מועדפות', labList('preferred_sensations', h.preferred_sensations)]);
    if(h.avoid_sensations && h.avoid_sensations.length) rows.push(['להימנע', labList('avoid_sensations', h.avoid_sensations)]);
    if(h.intensity) rows.push(['עוצמה', lab('intensity', h.intensity)]);
    rows.push(['הומלץ', (h.recommended_part_ids||[]).map(pn).join(' · ')]);
    rows.push(['נבחר', (h.final_part_ids||[]).map(pn).join(' · ') + (h.user_changes === 'yes' ? ' (שונה מההמלצה)' : '')]);
  }else{
    const nm = (id, fallback) => (state.catalog[id] && state.catalog[id].name) || fallback;
    if(h.best_part) rows.push(['עבד הכי טוב', nm(h.best_part_id, h.best_part) + (h.best_part_reasons && h.best_part_reasons.length ? ' – ' + labList('best_part_reasons', h.best_part_reasons) : '')]);
    if(h.less_part) rows.push(['עבד פחות', nm(h.less_part_id, h.less_part) + (h.less_part_reasons && h.less_part_reasons.length ? ' – ' + labList('less_part_reasons', h.less_part_reasons) : '')]);
    if(h.engagement_score) rows.push(['סקרנות', lab('engagement_score', h.engagement_score)]);
    if(h.independent_exploration_score) rows.push(['חקירה עצמאית', lab('independent_exploration_score', h.independent_exploration_score)]);
    if(h.parts_tested_ids && h.parts_tested_ids.length) rows.push(['חלקים שנוסו', h.parts_tested_ids.map(pn).join(' · ')]);
    if(h.usage_location && h.usage_location.length) rows.push(['איפה', labList('usage_location', h.usage_location)]);
    if(h.activity_type && h.activity_type.length) rows.push(['סוג פעילות', labList('activity_type', h.activity_type)]);
    if(h.observed_behaviors && h.observed_behaviors.length) rows.push(['מה ראינו', labList('observed_behaviors', h.observed_behaviors)]);
    if(h.adult_response && h.adult_response.length) rows.push(['מה עזר', labList('adult_response', h.adult_response)]);
    if(h.use_again) rows.push(['ישתמשו שוב', lab('use_again', h.use_again)]);
    if(h.feedback_text) rows.push(['הערות', h.feedback_text]);
  }
  const main = rows.slice(0, h.type==='recommendation' ? 6 : 4), more = rows.slice(main.length);
  const kv = r => `<dl class="kv">${r.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  return `<div class="entry ${h.type}">
    <header><b>${h.type === 'recommendation' ? '✨ התאמה' : '💬 מפגש'}</b><span class="chip${h.by_role==='ot' ? ' ot' : ''}">${esc(h.by || '')}${h.by_role ? ' · '+esc(ROLE_LABEL[h.by_role]||'') : ''}</span><span class="date">${fmtDateTime(h.date)}</span></header>
    ${kv(main)}
    ${more.length ? `<details><summary>עוד פרטים</summary>${kv(more)}</details>` : ''}
  </div>`;
}

/* ---------- start ---------- */
async function start(){
  const auth = H.getAuth();
  if(!auth || !H.isConfigured()){ showWelcome(); return; }
  try{
    const r = await H.api('children', {});
    state.user = r.user; state.children = r.children || [];
    setWho();
    const back = new URLSearchParams(location.search).get('child');
    if(back && state.children.some(k => k.child_id === back)) showChild(back); else showDashboard();
  }catch(e){
    if(e.code === 'auth_failed' || e.code === 'locked') H.logout();
    showWelcome();
  }
}
start();
})();
</script>
